name: Daily Xero Sync

on:
  schedule:
    # 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_full_resync:
        description: 'Force full journal resync for every tenant'
        required: false
        type: boolean
        default: false
      force_full_invoice_resync:
        description: 'Force full invoice resync for every tenant'
        required: false
        type: boolean
        default: false
      slug:
        description: 'Restrict to a single tenant slug (gbrm | mgl | mgi). Leave blank for all.'
        required: false
        type: string
        default: ''

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache virtual environment
        id: cache-venv
        uses: actions/cache@v3
        with:
          path: venv
          key: venv-${{ hashFiles('requirements.txt') }}

      - name: Setup virtual environment and install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev python3-dev
          python3 -m venv venv
          source venv/bin/activate
          pip install wheel
          pip install -r requirements.txt

      - name: Run Xero sync (all tenants)
        env:
          # Shared DB credentials (one Postgres, many schemas)
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # Per-tenant Xero credentials (refresh tokens live in DB)
          GBRM_XERO_CLIENT_ID: ${{ secrets.GBRM_XERO_CLIENT_ID }}
          GBRM_XERO_CLIENT_SECRET: ${{ secrets.GBRM_XERO_CLIENT_SECRET }}
          MGL_XERO_CLIENT_ID: ${{ secrets.MGL_XERO_CLIENT_ID }}
          MGL_XERO_CLIENT_SECRET: ${{ secrets.MGL_XERO_CLIENT_SECRET }}
          MGI_XERO_CLIENT_ID: ${{ secrets.MGI_XERO_CLIENT_ID }}
          MGI_XERO_CLIENT_SECRET: ${{ secrets.MGI_XERO_CLIENT_SECRET }}
        run: |
          source venv/bin/activate
          ARGS=""
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"
            echo "Restricting to slug: ${{ github.event.inputs.slug }}"
          fi
          if [ "${{ github.event.inputs.force_full_resync }}" == "true" ]; then
            ARGS="$ARGS --force-full-resync"
            echo "Force full journal resync enabled"
          fi
          if [ "${{ github.event.inputs.force_full_invoice_resync }}" == "true" ]; then
            ARGS="$ARGS --force-full-invoice-resync"
            echo "Force full invoice resync enabled"
          fi
          python3 xero_sync.py $ARGS
